appId: com.selectionassistant.lite
productName: AIA划词助手
icon: build/icon.png
npmRebuild: false
afterPack: scripts/after-pack.mjs
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: build/icon.png
asarUnpack:
  - node_modules/selection-hook/**
electronLanguages:
  - zh-CN
  - en-US
  - en-GB
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: AIA-Selection-Assistant-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  extendInfo:
    NSAppleEventsUsageDescription: AIA划词助手 uses accessibility APIs to detect selected text.
    NSSystemAdministrationUsageDescription: AIA划词助手 needs accessibility permission to detect selected text.
dmg:
  artifactName: AIA-Selection-Assistant-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: AIA-Selection-Assistant-Setup-${version}.${ext}
portable:
  artifactName: AIA-Selection-Assistant-Portable-${version}.${ext}
