appId: com.xd06.flashagentassistant
productName: FlashAgent-assistant
icon: build/icon.png
npmRebuild: false
afterPack: scripts/after-pack.mjs
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: build/icon.png
asarUnpack:
  - node_modules/selection-hook/**
  # The high-accuracy OCR engine (onnxruntime + paddle) is no longer bundled:
  # it downloads on demand into the user data directory (src/main/ocr/enginePack.ts).
electronLanguages:
  - zh-CN
  - en-US
  - en-GB
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: FlashAgent-assistant-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  extendInfo:
    NSAppleEventsUsageDescription: FlashAgent-assistant uses accessibility APIs to detect selected text.
    NSSystemAdministrationUsageDescription: FlashAgent-assistant needs accessibility permission to detect selected text.
dmg:
  artifactName: FlashAgent-assistant-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: FlashAgent-assistant-Setup-${version}.${ext}
portable:
  artifactName: FlashAgent-assistant-Portable-${version}.${ext}
