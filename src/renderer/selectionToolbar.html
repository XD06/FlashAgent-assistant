<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:5173 ws://localhost:5173 http://127.0.0.1:5173 http://localhost:5173; object-src 'none'; base-uri 'none'" />
    <title>Selection Toolbar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="toolbar-page" style="background: transparent; margin: 0; overflow: hidden">
    <div class="toolbar-root" id="toolbar-root"></div>
    <script>
      (function () {
        var root = document.getElementById('toolbar-root');
        var currentSelection = null;

        // ---- Icon SVGs (inline, matching icons.tsx paths) ----
        var ICON_PATHS = {
          'circle-help': '<circle cx="12" cy="12" r="8.8"/><path d="M9.6 9.3a2.6 2.6 0 0 1 4.9 1.2c0 1.6-1.8 2.2-2.5 3.1"/><circle cx="12" cy="16.6" r="1.05" fill="currentColor" stroke="none"/>',
          copy: '<rect x="8.5" y="8" width="11.5" height="12.5" rx="2.6"/><path d="M6.5 16H6a2.2 2.2 0 0 1-2.2-2.2V6A2.2 2.2 0 0 1 6 3.8h7.8A2.2 2.2 0 0 1 16 6v.4"/>',
          'flask-conical': '<path d="M10 3h4"/><path d="M10 3v4.5l-5.8 9.5A2 2 0 0 0 5.9 20h12.2a2 2 0 0 0 1.7-3l-5.8-9.5V3"/><path d="M8 13h8"/>',
          languages: '<path d="M7.2 3.5v2.1"/><path d="M3.2 5.6h8"/><path d="M9.6 5.6c-.4 2.9-2.2 5.3-5.2 6.8"/><path d="M5.1 7.8c1 1.6 2.6 3.1 4.8 4.2"/><path d="M12.8 20.4l3.5-8.6a.65.65 0 0 1 1.2 0l3.5 8.6"/><path d="M14.1 17.4h5.6"/>',
          summarize: '<rect x="3.5" y="4" width="17" height="16" rx="3.2"/><circle cx="7.6" cy="8.4" r="1.05" fill="currentColor" stroke="none"/><path d="M10.7 8.4h5.8"/><circle cx="7.6" cy="12" r="1.05" fill="currentColor" stroke="none"/><path d="M10.7 12h5.8"/><circle cx="7.6" cy="15.6" r="1.05" fill="currentColor" stroke="none"/><path d="M10.7 15.6h3.8"/>',
          'scan-text': '<path d="M7 4H5.3A2.3 2.3 0 0 0 3 6.3V8"/><path d="M17 4h1.7A2.3 2.3 0 0 1 21 6.3V8"/><path d="M7 20H5.3A2.3 2.3 0 0 1 3 17.7V16"/><path d="M17 20h1.7A2.3 2.3 0 0 0 21 17.7V16"/><path d="M8 8.5h8"/><path d="M8 12h8"/><path d="M8 15.5h5"/>',
          search: '<circle cx="10.5" cy="10.5" r="6.7"/><path d="m15.3 15.3 4.8 4.8"/>',
          sparkles: '<path d="M10 6.4 Q11.3 12.5 17.4 13.8 Q11.3 15.1 10 21.2 Q8.7 15.1 2.6 13.8 Q8.7 12.5 10 6.4 Z"/><path d="M17.8 2.9 Q18.5 5.5 21.1 6.2 Q18.5 6.9 17.8 9.5 Q17.1 6.9 14.5 6.2 Q17.1 5.5 17.8 2.9 Z"/>',
          'volume-2': '<path d="M11 5.5a1 1 0 0 0-1.7-.7L6 8.2H3.8A1.3 1.3 0 0 0 2.5 9.5v5a1.3 1.3 0 0 0 1.3 1.3H6l3.3 3.4a1 1 0 0 0 1.7-.7Z"/><path d="M15.5 8.8a4.8 4.8 0 0 1 0 6.4"/><path d="M18.6 6a8.6 8.6 0 0 1 0 12"/>',
          'book-open': '<path d="M12 6.4C10.4 4.9 7.8 4.4 4.2 4.4A1.2 1.2 0 0 0 3 5.6v11.6a1.2 1.2 0 0 0 1.2 1.2c3.6 0 6.2.5 7.8 2 1.6-1.5 4.2-2 7.8-2a1.2 1.2 0 0 0 1.2-1.2V5.6a1.2 1.2 0 0 0-1.2-1.2c-3.6 0-6.2.5-7.8 2Z"/><path d="M12 6.4v13.8"/>',
          bolt: '<path d="M14.2 3L5.2 13.5h6l-1.5 7.5 9-10.5h-6Z"/>',
          'file-text': '<path d="M14.2 3H6.8A2.3 2.3 0 0 0 4.5 5.3v13.4A2.3 2.3 0 0 0 6.8 21h10.4a2.3 2.3 0 0 0 2.3-2.3V8.3Z"/><path d="M14 3.2v4.3a1 1 0 0 0 1 1h4.3"/><path d="M8.5 13h7"/><path d="M8.5 16.5h4.5"/>',
          pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/>',
          'mouse-pointer': '<path d="M5.2 4.3a.8.8 0 0 1 1-.9l13.2 5.4a.8.8 0 0 1 0 1.5l-5.6 2.1-2.1 5.6a.8.8 0 0 1-1.5 0Z"/>',
          download: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/>',
          'arrow-up-right': '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
          pin: '<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/>',
          'pin-off': '<path d="M12 17v5"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/><path d="m2 2 20 20"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h11"/>',
          x: '<path d="m6 6 12 12"/><path d="M18 6 6 18"/>',
          square: '<rect x="5" y="5" width="14" height="14" rx="2"/>',
          'arrow-up': '<path d="M12 5v14"/><path d="m6 11 6-6 6 6"/>',
          power: '<path d="M12 3v9"/><path d="M6.4 7.4a8 8 0 1 0 11.2 0"/>',
          sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2"/><path d="M12 19.3v2.2"/><path d="m4.8 4.8 1.6 1.6"/><path d="m17.6 17.6 1.6 1.6"/><path d="M2.5 12h2.2"/><path d="M19.3 12h2.2"/><path d="m4.8 19.2 1.6-1.6"/><path d="m17.6 6.4 1.6-1.6"/>',
          moon: '<path d="M20 14.5A7.5 7.5 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5Z"/>',
          laptop: '<rect x="5" y="6" width="14" height="10" rx="2"/><path d="M3 18h18"/>',
          'trash-2': '<path d="M4 7h16"/><path d="M10 3h4"/><path d="M6.5 7 7.3 19a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9L17.5 7"/><path d="M10 11v5"/><path d="M14 11v5"/>',
          'undo-2': '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'
        };

        function iconSvg(name) {
          var paths = ICON_PATHS[name] || ICON_PATHS['sparkles'];
          return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
        }

        // ---- i18n (action labels only) ----
        var ACTION_LABELS = {
          'zh-CN': {
            translate: '翻译', explain: '解释', summarize: '总结', search: '搜索',
            copy: '复制', speak: '朗读', polish: '润色'
          },
          en: {
            translate: 'Translate', explain: 'Explain', summarize: 'Summarize', search: 'Search',
            copy: 'Copy', speak: 'Speak', polish: 'Polish'
          }
        };

        var DEFAULT_ACTION_NAMES = { translate: 'Translate', explain: 'Explain', summarize: 'Summarize', search: 'Search', copy: 'Copy', speak: 'Speak', polish: 'Polish' };

        function getActionLabel(action, language) {
          var labels = ACTION_LABELS[language] || ACTION_LABELS['zh-CN'];
          var localized = labels[action.id];
          var defaultName = DEFAULT_ACTION_NAMES[action.id];
          if (localized && (!action.name || action.name === defaultName)) return localized;
          return action.name || localized || action.id;
        }

        // ---- buildSearchUrl (from shared/actions.ts) ----
        // Local file paths are searched as text, never opened: openExternal on
        // Windows executes paths, and the selection is attacker-controlled.
        function isDirectUrl(value) {
          var text = value.trim();
          if (!text || /\s/.test(text)) return false;
          return /^(?:https?|mailto):/i.test(text);
        }

        function buildSearchUrl(action, selectedText) {
          var text = selectedText.trim();
          if (!text) return '';
          if (isDirectUrl(text)) return text;
          var template = action.searchUrlTemplate || 'https://www.google.com/search?q={{query}}';
          return template.replaceAll('{{query}}', encodeURIComponent(text)).replaceAll('{{text}}', encodeURIComponent(text));
        }

        // ---- Theme ----
        var systemAccentColor = '#007aff';
        var currentSettings = null;
        var colorSchemeMedia = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme(settings) {
          var theme = settings.theme;
          var resolved = theme === 'light' || theme === 'dark' ? theme
            : (colorSchemeMedia.matches ? 'dark' : 'light');
          var rootEl = document.documentElement;
          rootEl.dataset.theme = resolved;
          rootEl.style.colorScheme = resolved;
          if (window.assistantLite && window.assistantLite.app && window.assistantLite.app.resolveThemeVars) {
            var vars = window.assistantLite.app.resolveThemeVars({
              pureBlack: Boolean(settings.pureBlack),
              primaryColor: settings.primaryColor === undefined ? '#007aff' : settings.primaryColor,
              colorStyle: settings.colorStyle || 'vivid'
            }, resolved, systemAccentColor);
            for (var key in vars) {
              if (Object.prototype.hasOwnProperty.call(vars, key)) {
                rootEl.style.setProperty(key, vars[key]);
              }
            }
          }
        }

        function applyAppearance(settings) {
          var family = settings.fontFamily && settings.fontFamily.trim();
          if (family) document.documentElement.style.setProperty('--app-font', family + ', ui-sans-serif, system-ui, sans-serif');
          else document.documentElement.style.removeProperty('--app-font');
          document.documentElement.style.setProperty('--app-font-size', settings.fontSize + 'px');
        }

        // ---- Render ----
        // Action id/name come from settings and settings.update is reachable
        // from every window — never build attributes from them unescaped.
        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function render(settings) {
          currentSettings = settings;
          applyTheme(settings);
          applyAppearance(settings);
          var actions = settings.actions.filter(function (a) { return a.enabled; });
          var html = '';
          for (var i = 0; i < actions.length; i++) {
            var action = actions[i];
            var label = getActionLabel(action, settings.language);
            html += '<button class="toolbar-button" data-action-id="' + escapeHtml(action.id) + '" title="' + escapeHtml(label) + '">'
              + iconSvg(action.icon)
              + (settings.compactToolbar ? '' : '<span>' + escapeHtml(label) + '</span>')
              + '</button>';
          }
          root.innerHTML = html;

          // Measure width and notify main process
          requestAnimationFrame(function () {
            var width = Math.max(root.scrollWidth, root.getBoundingClientRect().width);
            if (width > 0) window.assistantLite.selection.determineToolbarSize(width);
          });
        }

        // ---- Action click handling ----
        root.addEventListener('click', function (e) {
          var btn = e.target.closest('.toolbar-button');
          if (!btn || !currentSelection) return;
          var actionId = btn.dataset.actionId;
          window.assistantLite.settings.get().then(function (settings) {
            var action = settings.actions.find(function (a) { return a.id === actionId; });
            if (!action) return;
            var text = currentSelection.text;
            if (!text) return;

            if (action.type === 'copy') {
              window.assistantLite.selection.writeClipboard(text);
            } else if (action.type === 'search') {
              var url = buildSearchUrl(action, text);
              if (url) window.assistantLite.app.openExternal(url);
              window.assistantLite.selection.hideToolbar();
            } else if (action.type === 'speak') {
              window.assistantLite.tts.play(text);
              window.assistantLite.selection.hideToolbar();
            } else {
              window.assistantLite.selection.processAction({
                action: action,
                selectedText: text,
                isFullscreen: currentSelection.isFullscreen
              });
              window.assistantLite.selection.hideToolbar();
            }
          });
        });

        // ---- Init ----
        if (window.assistantLite && window.assistantLite.app && window.assistantLite.app.getSystemAccentColor) {
          window.assistantLite.app.getSystemAccentColor().then(function (color) {
            if (color) {
              systemAccentColor = color;
              if (currentSettings) applyTheme(currentSettings);
            }
          });
          if (window.assistantLite.app.onSystemAccentColorChanged) {
            window.assistantLite.app.onSystemAccentColorChanged(function (color) {
              if (color) {
                systemAccentColor = color;
                if (currentSettings) applyTheme(currentSettings);
              }
            });
          }
        }
        colorSchemeMedia.addEventListener('change', function () {
          if (currentSettings && currentSettings.theme === 'system') applyTheme(currentSettings);
        });
        window.assistantLite.settings.get().then(render);
        window.assistantLite.settings.onChanged(render);
        window.assistantLite.selection.onSelected(function (payload) {
          currentSelection = payload;
        });
      })();
    </script>
  </body>
</html>
